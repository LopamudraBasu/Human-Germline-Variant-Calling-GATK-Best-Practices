<svg xmlns="http://www.w3.org/2000/svg" width="300" height="900">
  <style>
    .box { fill:#E8F0FE; stroke:#1A73E8; stroke-width:2; rx:8; ry:8; }
    .text { font-family:Arial, sans-serif; font-size:16px; text-anchor:middle; }
    .arrow { stroke:#555; stroke-width:2; marker-end:url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect class="box" x="50" y="20" width="200" height="40"/>
  <text class="text" x="150" y="45">Raw FASTQ</text>

  <line class="arrow" x1="150" y1="60" x2="150" y2="90"/>

  <rect class="box" x="50" y="90" width="200" height="40"/>
  <text class="text" x="150" y="115">FastQC</text>

  <line class="arrow" x1="150" y1="130" x2="150" y2="160"/>

  <rect class="box" x="50" y="160" width="200" height="40"/>
  <text class="text" x="150" y="185">fastp</text>

  <line class="arrow" x1="150" y1="200" x2="150" y2="230"/>

  <rect class="box" x="50" y="230" width="200" height="40"/>
  <text class="text" x="150" y="255">BWA-MEM</text>

  <line class="arrow" x1="150" y1="270" x2="150" y2="300"/>

  <rect class="box" x="50" y="300" width="200" height="40"/>
  <text class="text" x="150" y="325">SAMtools</text>

  <line class="arrow" x1="150" y1="340" x2="150" y2="370"/>

  <rect class="box" x="50" y="370" width="200" height="40"/>
  <text class="text" x="150" y="395">MarkDuplicates</text>

  <line class="arrow" x1="150" y1="410" x2="150" y2="440"/>

  <rect class="box" x="50" y="440" width="200" height="40"/>
  <text class="text" x="150" y="465">BQSR</text>

  <line class="arrow" x1="150" y1="480" x2="150" y2="510"/>

  <rect class="box" x="50" y="510" width="200" height="40"/>
  <text class="text" x="150" y="535">HaplotypeCaller</text>

  <line class="arrow" x1="150" y1="550" x2="150" y2="580"/>

  <rect class="box" x="50" y="580" width="200" height="40"/>
  <text class="text" x="150" y="605">VariantFiltration</text>

  <line class="arrow" x1="150" y1="620" x2="150" y2="650"/>

  <rect class="box" x="50" y="650" width="200" height="40"/>
  <text class="text" x="150" y="675">SnpEff Annotation</text>

  <line class="arrow" x1="150" y1="690" x2="150" y2="720"/>

  <rect class="box" x="50" y="720" width="200" height="40"/>
  <text class="text" x="150" y="745">Annotated VCF</text>
</svg>
